name: Linux build

# Builds the standalone binary. Runs on every push and pull request so a
# broken build is caught by the commit that caused it, and attaches the
# binary to the release when a tag is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Qt xcb libraries
        # what vendor/ carries locally for people without root; Qt 6.5+
        # will not load its xcb platform plugin without them
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libdbus-1-3 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check the Linux backend imports
        run: |
          python -c "import platform_support; assert platform_support.LINUX"
          python -c "import spotify; print('backend:', spotify.BACKEND)"
          python -c "import overlay, transliterate"

      - name: Romanization sanity check
        run: |
          python -c "from transliterate import romanize; assert romanize('दिल') == 'dil', romanize('दिल'); assert romanize('ਰੰਗ') == 'rang', romanize('ਰੰਗ'); print('romanization ok')"

      - name: Build
        run: pyinstaller --noconfirm spotify-overlay.spec

      - name: Smoke-test the binary
        # no Spotify and no D-Bus session on the runner, so it cannot play
        # anything — this only proves the binary starts, finds its Qt
        # plugins and does not crash on import
        run: |
          xvfb-run -a ./dist/spotify-overlay &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "the overlay exited on its own"
            exit 1
          fi
          kill "$pid"
          echo "started and stayed up"

      - uses: actions/upload-artifact@v4
        # for pull requests, where there is no release to publish to. run
        # artifacts are not public — they need a signed-in account with read
        # access and expire after 90 days — so the publish job below is what
        # actually gets a binary to users
        with:
          name: spotify-overlay-linux
          path: dist/spotify-overlay
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spotify-overlay
          generate_release_notes: true

  publish-latest:
    # a rolling prerelease so the newest main build is downloadable by
    # anyone without a GitHub account. tagged v* builds go to their own
    # release from the build job above and are untouched by this.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    # the Linux and Windows workflows publish to the same release, so let
    # only one of them write to it at a time
    concurrency:
      group: publish-latest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: spotify-overlay-linux
          path: dist

      - name: Move the latest tag to this commit
        # the release is pinned to a tag, so the tag has to follow main.
        # "latest" does not match the v* trigger, so this does not loop.
        run: |
          git tag -f latest
          git push -f origin latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest main build
          body: >
            Automatically rebuilt from the tip of `main`
            (${{ github.sha }}). For a stable version, use the newest `v*`
            release instead.
          prerelease: true
          # do not let a rolling build displace the newest tagged release
          # as the one the repo page points at
          make_latest: false
          files: dist/spotify-overlay
